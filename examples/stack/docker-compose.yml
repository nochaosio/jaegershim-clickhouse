name: jaegershim-example

services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP + Play UI (/play) + Dashboard (/dashboard)
      - "9009:9000"   # native protocol (9000 ocupada no host)
    volumes:
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/otel.xml:ro
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_VERSION}
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health_check
      - "8888:8888"   # métricas internas (Prometheus)
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  mongo:
    image: mongo:${MONGO_VERSION}
    container_name: hyperdx-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  hyperdx:
    image: clickhouse/clickstack:${CLICKSTACK_VERSION}
    container_name: hyperdx
    environment:
      FRONTEND_URL: http://localhost:8180
      HYPERDX_APP_URL: http://localhost
      HYPERDX_APP_PORT: 8180
      HYPERDX_API_PORT: 8100
      SERVER_URL: http://127.0.0.1:8100
      HYPERDX_LOG_LEVEL: info
      MONGO_URI: mongodb://mongo:27017/hyperdx
      USAGE_STATS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: hyperdx-app
      DEFAULT_CONNECTIONS: '[{"name":"Local ClickHouse","host":"http://clickhouse:8123","username":"${CLICKHOUSE_USER}","password":"${CLICKHOUSE_PASSWORD}"}]'
      DEFAULT_SOURCES: '[{"from": {"databaseName": "default", "tableName": "otel_logs"}, "kind": "log", "timestampValueExpression": "TimestampTime", "name": "Logs", "displayedTimestampValueExpression": "Timestamp", "implicitColumnExpression": "Body", "serviceNameExpression": "ServiceName", "bodyExpression": "Body", "eventAttributesExpression": "LogAttributes", "resourceAttributesExpression": "ResourceAttributes", "defaultTableSelectExpression": "Timestamp,ServiceName,SeverityText,Body", "severityTextExpression": "SeverityText", "traceIdExpression": "TraceId", "spanIdExpression": "SpanId", "connection": "Local ClickHouse", "traceSourceId": "Traces", "metricSourceId": "Metrics"}, {"from": {"databaseName": "default", "tableName": "otel_traces"}, "kind": "trace", "timestampValueExpression": "Timestamp", "name": "Traces", "displayedTimestampValueExpression": "Timestamp", "implicitColumnExpression": "SpanName", "serviceNameExpression": "ServiceName", "eventAttributesExpression": "SpanAttributes", "resourceAttributesExpression": "ResourceAttributes", "defaultTableSelectExpression": "Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName", "traceIdExpression": "TraceId", "spanIdExpression": "SpanId", "durationExpression": "Duration", "durationPrecision": 9, "parentSpanIdExpression": "ParentSpanId", "spanNameExpression": "SpanName", "spanKindExpression": "SpanKind", "statusCodeExpression": "StatusCode", "statusMessageExpression": "StatusMessage", "spanEventsValueExpression": "Events", "spanLinksValueExpression": "Links", "connection": "Local ClickHouse", "logSourceId": "Logs", "metricSourceId": "Metrics"}, {"from": {"databaseName": "default", "tableName": ""}, "kind": "metric", "timestampValueExpression": "TimeUnix", "name": "Metrics", "resourceAttributesExpression": "ResourceAttributes", "metricTables": {"gauge": "otel_metrics_gauge", "histogram": "otel_metrics_histogram", "sum": "otel_metrics_sum", "summary": "otel_metrics_summary", "exponential histogram": "otel_metrics_exponential_histogram"}, "connection": "Local ClickHouse", "logSourceId": "Logs"}]'
    ports:
      - "8180:8180"   # HyperDX UI
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - mongo
      - clickhouse
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@${GRAFANA_CLICKHOUSE_PLUGIN_VERSION}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  telemetrygen-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:${TELEMETRYGEN_VERSION}
    container_name: telemetrygen-traces
    command: >-
      traces --otlp-endpoint otel-collector:4317 --otlp-insecure
      --duration 87600h --rate 5 --service demo-app --child-spans 3
    depends_on:
      - otel-collector
    restart: unless-stopped

  telemetrygen-logs:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:${TELEMETRYGEN_VERSION}
    container_name: telemetrygen-logs
    command: >-
      logs --otlp-endpoint otel-collector:4317 --otlp-insecure
      --duration 87600h --rate 5 --service demo-app --body 'user login ok' --severity-text INFO
    depends_on:
      - otel-collector
    restart: unless-stopped

  telemetrygen-metrics:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:${TELEMETRYGEN_VERSION}
    container_name: telemetrygen-metrics
    command: >-
      metrics --otlp-endpoint otel-collector:4317 --otlp-insecure
      --duration 87600h --rate 5 --service demo-app --metric-type Sum --otlp-metric-name demo_requests_total
    depends_on:
      - otel-collector
    restart: unless-stopped

  mcp-clickhouse:
    image: ghcr.io/clickhouse/mcp-clickhouse:${MCP_CLICKHOUSE_VERSION}
    container_name: mcp-clickhouse
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: 8765
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN}
      CLICKHOUSE_MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*
    ports:
      - "8765:8765"   # MCP (streamable HTTP em /mcp)
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

  jaegershim:
    build: ../..
    image: ghcr.io/nochaosio/jaegershim-clickhouse:${JAEGERSHIM_VERSION:-dev}
    container_name: jaegershim
    environment:
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: ${JAEGER_CH_USER}
      CLICKHOUSE_PASSWORD: ${JAEGER_CH_PASSWORD}
      CLICKHOUSE_DATABASE: default
      TRACES_TABLE: otel_traces
      SERVICES_LOOKBACK: 168h
    ports:
      - "16686:16686"   # jaegershim: Jaeger UI + API (legacy /api e v3 /api/v3) sobre o ClickHouse
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

volumes:
  ch_data:
  ch_logs:
  mongo_data:
  grafana_data:
