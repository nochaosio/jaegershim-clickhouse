# Referências Jaeger para o de-para do jaegershim (jaegershim)
# Uso (em examples/stack): docker compose -f docker-compose.yml -f compat/docker-compose.jaeger-test.yml up -d
services:
  otel-collector:
    volumes:
      - ./compat/otel-collector-jaeger-test.yaml:/etc/otelcol-contrib/config.yaml:ro
  jaeger-reference:
    image: jaegertracing/jaeger:2.23.0
    container_name: jaeger-reference
    ports:
      - "16687:16686"   # UI/API do Jaeger real (referência)
  jaeger-reference-legacy:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger-reference-legacy
    ports:
      - "16688:16686"   # Jaeger 2.20 (último com a API legacy /api/*, usada pelo Grafana)
