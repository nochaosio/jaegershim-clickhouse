apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse-otel
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: ${CLICKHOUSE_USER}
      defaultDatabase: default
      logs:
        defaultDatabase: default
        defaultTable: otel_logs
        otelEnabled: true
        otelVersion: latest
      traces:
        defaultDatabase: default
        defaultTable: otel_traces
        otelEnabled: true
        otelVersion: latest
        durationUnit: nanoseconds
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}

  - name: ClickHouse PromQL
    uid: clickhouse-promql
    type: prometheus
    access: proxy
    url: http://clickhouse:8123/prometheus
    basicAuth: true
    basicAuthUser: ${CLICKHOUSE_USER}
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
    secureJsonData:
      basicAuthPassword: ${CLICKHOUSE_PASSWORD}

  - name: jaegershim
    uid: jaegershim
    type: jaeger
    access: proxy
    url: http://jaegershim:16686
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: clickhouse-otel
      nodeGraph:
        enabled: true
